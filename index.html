
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONE MILLION COINS</title>

<!-- Three.js Import-Zuordnung -->
<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/": "https://cdn.jsdelivr.net/npm/three@0.180.0/"
    }
}
</script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #777;
    font-family: Arial, sans-serif;
}

canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    display: block;
}

#menu {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 22px;
    color: white;
    background: rgba(0,0,0,0.9);
    text-align: center;
}

#menu h1 {
    font-size: clamp(35px, 7vw, 75px);
    letter-spacing: 5px;
}

#menu p {
    color: #bbb;
}

#start {
    padding: 18px 60px;
    font-size: 21px;
    font-weight: bold;
    color: white;
    background: #b88700;
    border: 2px solid #edc52b;
    cursor: pointer;
}

#start:hover {
    background: #e0ad00;
}

#start:disabled {
    opacity: 0.5;
    cursor: wait;
}

#crosshair {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: white;
    transform: translate(-50%, -50%);
    z-index: 10;
    pointer-events: none;
}

#hint {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-size: 13px;
    text-shadow: 0 2px 5px black;
    z-index: 10;
    pointer-events: none;
}

#status {
    color: #ffcc44;
    font-size: 14px;
    max-width: 90%;
    overflow-wrap: anywhere;
}
</style>
</head>

<body>

<div id="menu">
    <h1>ONE MILLION COINS</h1>

    <p>Ein riesiger Betonbunker voller Goldmünzen.</p>

    <button id="start" disabled>
        SPIEL WIRD GELADEN ...
    </button>

    <p>WASD · Maus · ESC zum Pausieren</p>

    <div id="status">Lade Spiel...</div>
</div>

<div id="crosshair"></div>

<div id="hint">
    WASD – Bewegen · Maus – Umschauen · ESC – Menü
</div>

<script type="module">

const startButton = document.getElementById("start");
const statusText = document.getElementById("status");

try {

    const game = await import("./game.js");

    await game.initGame();

    startButton.disabled = false;
    startButton.textContent = "SPIELEN";

    statusText.textContent = "Bereit!";

    startButton.addEventListener("click", () => {

        game.startGame();

    });

} catch (error) {

    console.error("SPIELFEHLER:", error);

    startButton.textContent = "FEHLER";

    statusText.textContent =
        error.message || "Unbekannter Fehler";

    statusText.style.color = "#ff7777";

}

</script>

</body>
</html>
