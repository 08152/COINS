
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONE MILLION COINS</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #777;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
        }

        #menu {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
            background: rgba(0,0,0,0.88);
            color: white;
            text-align: center;
        }

        #menu h1 {
            font-size: clamp(35px, 7vw, 75px);
            letter-spacing: 5px;
        }

        #menu p {
            color: #bbb;
        }

        #start {
            padding: 17px 55px;
            border: 2px solid #d6a900;
            background: #b88700;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        #start:hover {
            background: #e0ad00;
        }

        #crosshair {
            position: fixed;
            left: 50%;
            top: 50%;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: white;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        #hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 13px;
            pointer-events: none;
            text-shadow: 0 2px 5px black;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
        }
    }
    </script>
</head>

<body>

    <div id="menu">
        <h1>ONE MILLION COINS</h1>
        <p>Ein riesiger Betonbunker voller Goldmünzen.</p>
        <button id="start">SPIELEN</button>
        <p>WASD · Maus · ESC zum Pausieren</p>
    </div>

    <div id="crosshair"></div>
    <div id="hint">WASD – Bewegen · Maus – Umschauen · ESC – Menü</div>

    <script type="module" src="./game.js"></script>

</body>
</html>
